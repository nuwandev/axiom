name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          check-latest: true

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go mod verify
        run: go mod verify

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test ./... -race

      - name: windows cross-compile
        # The Windows platform code (service adapter, PowerShell executor, Job
        # Objects, NTFS ACL checks) is not exercised by the Linux job above.
        # This step keeps it compiling and vetting; real behaviour is verified
        # on a Windows Server 2022 host before a release (see docs/development.md).
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: powershell scripts are ASCII
        # A non-ASCII byte in a BOM-less .ps1 is mis-decoded by Windows
        # PowerShell 5.1 (ANSI fallback) and can silently break parsing.
        # Keep every shipped script and sample pure ASCII.
        run: |
          hits="$(grep -rlP '[^\x00-\x7F]' --include='*.ps1' --include='*.ps1.sample' . || true)"
          if [ -n "$hits" ]; then
            echo "non-ASCII bytes in PowerShell files (breaks Windows PowerShell 5.1):"
            echo "$hits"
            exit 1
          fi

  windows-test:
    name: windows build, vet, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          check-latest: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        # Unit + non-elevated integration coverage (executor/PowerShell, Job
        # Object containment, winsec pure logic + Win32 read path, job manager).
        # Full config.Load and mTLS API integration on Windows need an
        # ACL-configured host and are covered by the pre-release validation
        # pass, not here.
        run: go test ./...

      - name: powershell scripts parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = $false
          Get-ChildItem -Recurse -Include *.ps1, *.ps1.sample -File |
            Where-Object { $_.FullName -notmatch '\\vendor\\' } |
            ForEach-Object {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
              if ($errs) {
                $bad = $true
                Write-Host "PARSE FAIL: $($_.FullName)"
                $errs | ForEach-Object { Write-Host "  $($_.Message)" }
              }
            }
          if ($bad) { exit 1 }

  rpm-package-smoke-test:
    name: RPM package builds
    runs-on: ubuntu-latest
    env:
      # Pinned, not "latest": nfpm's own go.mod can require a newer Go
      # toolchain than this project targets (hit exactly that with
      # `go install nfpm@latest` — it started requiring Go 1.26 while this
      # project stays on 1.23 to match go.mod). Downloading the prebuilt
      # binary release sidesteps that entirely: it doesn't matter what Go
      # version compiled nfpm itself, only what compiled Axiom. Bump this
      # deliberately when there's a reason to, not automatically.
      NFPM_VERSION: "2.47.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          check-latest: true

      - name: install nfpm (prebuilt binary) and rpm inspection tools
        run: |
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          chmod +x /usr/local/bin/nfpm
          nfpm --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm gettext-base

      - name: build a throwaway linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/axiom-smoke-test ./cmd/axiom

      - name: package it as an RPM
        run: |
          GENERATED_SPEC="$(mktemp)"
          VERSION=0.0.0-ci GOARCH=amd64 BIN_PATH=/tmp/axiom-smoke-test \
            envsubst '${VERSION} ${GOARCH} ${BIN_PATH}' < packaging/rpm/nfpm.yaml.tmpl > "$GENERATED_SPEC"
          cd packaging/rpm
          nfpm package --config "$GENERATED_SPEC" --target /tmp/ --packager rpm

      - name: sanity-check the package contents
        run: |
          rpm -qlp /tmp/axiom-0.0.0~ci-1.x86_64.rpm > /tmp/rpm-contents.txt
          grep -qx '/usr/local/bin/axiom' /tmp/rpm-contents.txt
          grep -qx '/etc/systemd/system/axiom.service' /tmp/rpm-contents.txt
          echo "RPM contents look correct:"
          cat /tmp/rpm-contents.txt
