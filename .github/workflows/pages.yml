name: Pages

# Publishes the documentation site (website/, generated from README.md and
# docs/) at the site root and the architecture presentation (presentation/)
# under /architecture/. Runs when either source changes on main, or on demand.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "website/**"
      - "presentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: install Zensical (pinned in requirements.txt)
        working-directory: presentation
        run: pip install -r requirements.txt

      - name: prepare documentation pages
        run: python website/tools/prepare_docs.py

      - name: build documentation site (strict)
        working-directory: website
        run: zensical build -f zensical.toml -s

      - name: build presentation (strict)
        working-directory: presentation
        run: zensical build -f zensical.toml -s

      - name: validate the built presentation
        working-directory: presentation
        run: python tools/check_site.py

      - name: check generated diagrams are current
        working-directory: presentation
        run: python tools/generate_svgs.py --check

      - name: assemble the published site
        run: |
          mkdir _site
          cp -r website/site/. _site/
          cp -r presentation/site _site/architecture

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
