name: Release

# Builds every published artifact (linux/amd64, linux/arm64 + RPMs,
# windows/amd64 + offline install bundle + MSI) with scripts/build-release.sh,
# scripts/build-msi.sh (on a Windows runner) and
# publishes them to a GitHub Release.
#
# Triggered by pushing a vX.Y.Z tag, per CONTRIBUTING.md's "Cutting a
# release" — build-release.sh itself refuses to run for a real tag unless
# docs/INSTALL.md's version pins were already synced
# (scripts/sync-doc-versions.sh), so a release can't ship silently stale
# download links.
#
# workflow_dispatch is a dry run only: it builds and uploads the artifacts
# as a workflow run artifact so the pipeline itself can be exercised without
# cutting a real tag or publishing a GitHub Release.

on:
  push:
    tags:
      - "v*.*.*" # e.g. v1.2.3; scripts/sync-doc-versions.sh / build-release.sh enforce the exact vX.Y.Z shape
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for a dry run, e.g. v0.0.0-dryrun (does not publish a GitHub Release)"
        required: true
        default: "v0.0.0-dryrun"

# Least privilege: every job is read-only unless it declares more. Only the
# publish job needs write access (the GitHub Release and attestations), and
# only the publish job ever receives the signing key.
permissions:
  contents: read

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      # Pin the exact toolchain patch version release binaries are built
      # with, independent of whatever the runner image defaults to.
      GOTOOLCHAIN: local
      NFPM_VERSION: "2.47.0"
      # NOTE: the signing key is deliberately NOT available in this job.
      # It compiles code and runs third-party build tools; signing happens in
      # the publish job (scripts/sign-release.sh), so these steps cannot read
      # the key. RPMs built here are unsigned until then.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.4"

      - name: determine version
        id: version
        env:
          # Passed through the environment, never interpolated into the
          # script, so a crafted dispatch input cannot inject shell.
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            publish=false
          else
            version="$GITHUB_REF_NAME"
            publish=true
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "error: version must look like v1.2.3 or v0.0.0-dryrun, got: $version" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: install packaging tools (nfpm, zip, envsubst)
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          # Integrity pin only: this digest was copied from the release's own
          # checksums.txt, so it detects a later substitution of the archive
          # but does NOT independently authenticate it. Independent options:
          # cosign verify-blob of checksums.txt against the release's
          # checksums.txt.sigstore.json, or build nfpm from source with
          # `go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0`
          # (module hashes are checked against sum.golang.org). Update this
          # digest together with NFPM_VERSION.
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  /tmp/nfpm.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/nfpm.tar.gz nfpm
          chmod +x /usr/local/bin/nfpm
          nfpm --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm gettext-base zip

      # SBOM generator, pinned to an exact version; the module and its
      # dependencies are verified against the Go checksum database. It reads
      # the finished binary's embedded module list, so the SBOM describes the
      # artifact that is published.
      - name: install SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0

      - name: go vet / test (release must build clean)
        run: |
          go vet ./...
          go test ./...

      - name: build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/build-release.sh

      - name: require the SBOMs
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for target in linux-amd64 windows-amd64; do
            sbom="dist/${VERSION}/axiom-${VERSION}-${target}.sbom.cdx.json"
            test -s "$sbom"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["bomFormat"]=="CycloneDX"; print(sys.argv[1], "ok:", [c["name"] for c in d.get("components",[])])' "$sbom"
          done

      - name: upload linux/windows artifacts for the MSI and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-base
          path: dist/${{ steps.version.outputs.value }}/*
          if-no-files-found: error
          retention-days: 14

  # WiX only supports Windows (on the Linux runner it mis-resolves the
  # source paths in Axiom.wxs), so the MSI is built here from the exact
  # axiom.exe the build job produced. Pinned to WiX v5: v7+ requires
  # accepting a paid Open Source Maintenance Fee EULA just to build.
  msi:
    name: build Windows MSI
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-base
          path: dist/${{ needs.build.outputs.version }}

      - name: install WiX
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: build MSI
        shell: bash
        run: bash scripts/build-msi.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-msi
          path: dist/${{ needs.build.outputs.version }}/*.msi
          if-no-files-found: error
          retention-days: 14

  publish:
    name: collect and publish
    needs: [build, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # sign the build-provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # Public info -- matches packaging/rpm/axiom-signing-public.asc. The
      # secret key is the AXIOM_GPG_PRIVATE_KEY repo secret and is exposed
      # only to the signing step below (never at job level).
      GPG_KEY_ID: "C6A4ECAEA8BDA887"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-base
          path: dist/${{ needs.build.outputs.version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-msi
          path: dist/${{ needs.build.outputs.version }}

      # A real release (tag push) MUST be signed: if the signing secret is
      # missing or empty this job fails here, before anything is published.
      # A workflow_dispatch dry run may proceed unsigned (and says so).
      - name: require signing key for a real release
        env:
          AXIOM_GPG_PRIVATE_KEY: ${{ secrets.AXIOM_GPG_PRIVATE_KEY }}
          PUBLISH: ${{ needs.build.outputs.publish }}
        run: |
          if [[ -z "$AXIOM_GPG_PRIVATE_KEY" ]]; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::AXIOM_GPG_PRIVATE_KEY is not available; refusing to publish an unsigned release."
              exit 1
            fi
            echo "::warning::No signing key available: this dry run produces UNSIGNED artifacts."
          fi

      - name: install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # Signs the RPMs, regenerates SHA256SUMS over the full artifact set
      # (build-release.sh wrote it before the MSI existed), detach-signs it,
      # and verifies everything against the public key committed in the
      # repo. The key is imported into a temporary keyring that is removed on
      # exit. See scripts/sign-release.sh.
      - name: sign and verify release artifacts
        env:
          AXIOM_GPG_PRIVATE_KEY: ${{ secrets.AXIOM_GPG_PRIVATE_KEY }}
          REQUIRE_SIGNING: ${{ needs.build.outputs.publish == 'true' && '1' || '0' }}
        run: bash scripts/sign-release.sh

      - name: show checksums
        run: |
          cd "dist/${VERSION}"
          ls -la
          cat SHA256SUMS

      # SLSA build provenance for every published file, recorded in GitHub's
      # attestation store. Verify with: gh attestation verify <file> -R nuwandev/axiom
      # Not yet exercised: confirm with the v0.0.0-dryrun run before relying on it.
      - name: attest build provenance
        if: needs.build.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.version }}/axiom-*

      - name: upload build artifacts (workflow run, every trigger)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: axiom-${{ needs.build.outputs.version }}
          path: dist/${{ needs.build.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14

      - name: publish to GitHub Releases
        if: needs.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$(mktemp)"
          # Pull this version's own section out of CHANGELOG.md ("## [X.Y.Z] ..."
          # up to the next "## [" heading) so the release notes are the notes,
          # not a changelog dump. Falls back to GitHub's auto-generated notes
          # if the heading isn't found (e.g. CHANGELOG wasn't updated first).
          bare="${VERSION#v}"
          awk -v ver="$bare" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found=1; next } }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          flags=(--title "Axiom ${VERSION}")
          if [[ -s "$notes_file" ]]; then
            flags+=(--notes-file "$notes_file")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$VERSION" "${flags[@]}" -- dist/"${VERSION}"/*
