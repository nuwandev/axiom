# Example Axiom agent configuration. Copy to /etc/axiom/config.yaml and
# adjust for your environment. See README.md for the full field reference.

agent:
  id: example-uat-01
  name: Example UAT Agent
  listen:
    address: 0.0.0.0
    port: 8443

security:
  mtls:
    ca_file: /etc/axiom/certs/ca.crt
    cert_file: /etc/axiom/certs/server.crt
    key_file: /etc/axiom/certs/server.key
  # health:
  #   allow_anonymous: true   # off by default; opt in only if your network
  #                           # health check cannot present a client cert.

audit:
  path: /var/log/axiom/audit.log

# Both optional; shown here at their built-in defaults.
output:
  max_bytes: 2097152   # 2 MiB cap on captured stdout/stderr, per stream, per job

jobs:
  max_history: 1000    # in-memory job count kept for GET /v1/jobs/{id}; oldest
                        # finished job is evicted once this is exceeded. This is
                        # not a durable store — job history is lost on restart.
                        # The audit log is the durable execution record.

actions:
  # Trigger this first after a fresh install to confirm mTLS, authorization,
  # script execution and the audit trail all actually work end-to-end --
  # see docs/getting-started.md. No external dependency, no side effect.
  hello.world:
    command: /opt/axiom/actions/hello-world.sh
    timeout: 30s
    concurrency: shared

  # Add your own actions below -- Axiom has no opinion on what they do.
  # Each one is just a name, a path to a script you wrote and reviewed, and
  # optionally some typed, pattern-validated parameters. Uncomment and
  # adapt this shape for your first real action:
  #
  # your.action.name:
  #   command: /opt/axiom/actions/your-script.sh
  #   timeout: 10m
  #   concurrency: exclusive   # or "shared" if concurrent runs are safe
  #   parameters:
  #     some_param:
  #       type: string
  #       pattern: '^[a-zA-Z0-9._-]{1,128}$'
  #       required: true

authorization:
  identities:
    # The key must match the client certificate's Common Name exactly.
    example-ci:
      actions:
        - hello.world
        # - your.action.name
