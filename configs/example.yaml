# Example Axiom agent configuration. Copy to /etc/axiom/config.yaml and
# adjust for your environment. See README.md for the full field reference.

agent:
  id: example-uat-01
  name: Example UAT Agent
  listen:
    address: 0.0.0.0
    port: 8443
    # max_connections: 256   # optional, off (0) by default: most connections
    #                        # open at once, TLS handshakes included.

security:
  mtls:
    ca_file: /etc/axiom/certs/ca.crt
    cert_file: /etc/axiom/certs/server.crt
    key_file: /etc/axiom/certs/server.key
    # crl_file: /etc/axiom/certs/ca.crl   # optional: revoked client certificates,
    #                                     # signed by ca_file; re-read on reload.
    #                                     # Refuses every client after its nextUpdate.
  # health:
  #   allow_anonymous: true   # off by default; opt in only if your network
  #                           # health check cannot present a client cert.

audit:
  path: /var/log/axiom/audit.log   # on Ubuntu use /var/lib/axiom/audit.log:
                                   # /var/log is group-writable there (root:syslog
                                   # 0775), so Axiom refuses it.
  # Also emit each record to journald/syslog. Forward that stream to a central
  # collector: the local file is writable by the account that runs actions.
  # (On Windows the same setting writes to the Application event log.)
  syslog: true
  # max_rejections_per_minute: 30   # optional, off (0) by default: most 401/403
  #                                 # records one identity may cause per minute
  #                                 # (unauthenticated peers share one count);
  #                                 # the rest are counted in a summary record.

# Both optional; shown here at their built-in defaults.
output:
  max_bytes: 2097152   # 2 MiB cap on captured stdout/stderr, per stream, per job

jobs:
  max_concurrent: 16   # agent-wide cap on queued+running jobs (all actions);
                       # over the cap a trigger gets 429 and creates no job.
  max_history: 1000    # in-memory job count kept for GET /v1/jobs/{id}; oldest
                        # finished job is evicted once this is exceeded. In memory
                        # unless state_path is set; output is never kept across a
                        # restart. The audit log is the durable execution record.
  # state_path: /var/lib/axiom/jobs.state   # optional: keep job status and
  #                               # idempotency keys across restarts (never output
  #                               # or parameter values). Directory must be owned
  #                               # by the service account. See docs/INSTALL.md s11.
  # max_triggers_per_minute: 60   # optional, off (0) by default: most triggers one
  #                               # identity may make per minute; over it a trigger
  #                               # gets 429 with Retry-After and creates no job.
  # idempotency_window: 10m       # optional, default 10m: how long an Idempotency-Key
  #                               # sent with a trigger is remembered (1s-24h).

actions:
  # Trigger this first after a fresh install to confirm mTLS, authorization,
  # script execution and the audit trail all actually work end-to-end --
  # see docs/getting-started.md. No external dependency, no side effect.
  hello.world:
    command: /opt/axiom/actions/hello-world.sh
    timeout: 30s
    concurrency: shared

  # Add your own actions below -- Axiom has no opinion on what they do.
  # Each one is just a name, a path to a script you wrote and reviewed, and
  # optionally some typed, pattern-validated parameters. Uncomment and
  # adapt this shape for your first real action:
  #
  # your.action.name:
  #   command: /opt/axiom/actions/your-script.sh
  #   timeout: 10m
  #   concurrency: exclusive   # or "shared" if concurrent runs are safe
  #   parameters:
  #     some_param:
  #       type: string
  #       pattern: '^[a-zA-Z0-9._-]{1,128}$'
  #       required: true

authorization:
  identities:
    # The key must match the client certificate's Common Name exactly.
    example-ci:
      actions:
        - hello.world
        # - your.action.name
