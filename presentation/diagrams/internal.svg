<svg class="ax-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1070" role="img" aria-labelledby="intl-t intl-d"><title id="intl-t">Inside one Axiom agent: Go packages and request path</title><desc id="intl-d">The cmd/axiom lifecycle builds and wires the TLS listener, identity middleware, handlers, job manager, executor, configuration and audit subsystems. Build-tagged unix and windows files supply the platform-specific behaviour.</desc><defs><marker id="intl-m-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ax-mk ax-mk-ctl"/></marker><marker id="intl-m-loc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ax-mk ax-mk-loc"/></marker><marker id="intl-m-data" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ax-mk ax-mk-data"/></marker><marker id="intl-m-aud" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ax-mk ax-mk-aud"/></marker><marker id="intl-m-pki" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ax-mk ax-mk-pki"/></marker></defs>
<rect x="20" y="52" width="1540" height="190" rx="10" class="ax-zone"/>
<text x="40" y="78" class="ax-th">APPLICATION LIFECYCLE · cmd/axiom</text>
<rect x="40" y="96" width="300" height="104" rx="8" class="ax-box"/>
<text x="56" y="122" class="ax-tb">main_unix.go · run()</text>
<text x="56" y="148" class="ax-t">flags, config.Load()</text>
<text x="56" y="168" class="ax-t">SIGINT / SIGTERM → context</text>
<path d="M190,200 V214" class="ax-l-data"/>
<rect x="360" y="96" width="300" height="104" rx="8" class="ax-box"/>
<text x="376" y="122" class="ax-tb">main_windows.go · run()</text>
<text x="376" y="148" class="ax-t">console mode: Ctrl-C → context</text>
<text x="376" y="168" class="ax-t">service mode: runAsService()</text>
<path d="M510,200 V214" class="ax-l-data"/>
<rect x="680" y="96" width="300" height="104" rx="8" class="ax-box"/>
<text x="696" y="122" class="ax-tb">service_windows.go</text>
<text x="696" y="148" class="ax-t">SCM: Execute(), Stop / Shutdown</text>
<text x="696" y="168" class="ax-t">-install-service, recovery</text>
<path d="M830,200 V214" class="ax-l-data"/>
<path d="M190,214 H1010" class="ax-l-data" marker-end="url(#intl-m-data)"/>
<rect x="1010" y="90" width="530" height="138" rx="8" class="ax-box ax-box-agent"/>
<text x="1026" y="116" class="ax-tb">serve(ctx, cfg, logger)</text>
<text x="1026" y="134" class="ax-tm">cmd/axiom/main.go · one lifecycle, every entrypoint</text>
<text x="1026" y="158" class="ax-t">CheckPlatformPrerequisites · audit.Open (+ sink)</text>
<text x="1026" y="177" class="ax-t">jobs.NewManager · api.NewServer · tls.Listen</text>
<text x="1026" y="196" class="ax-t">on stop: BeginShutdown → HTTP drain (30 s)</text>
<text x="1026" y="215" class="ax-t">then Manager.Shutdown (20 s) → audit.Close</text>
<path d="M1275,228 V262" class="ax-l-ctl" marker-end="url(#intl-m-ctl)"/>
<rect x="20" y="262" width="1540" height="262" rx="10" class="ax-zone"/>
<text x="40" y="288" class="ax-th">REQUEST PATH · internal/auth, internal/api, internal/jobs</text>
<rect x="40" y="304" width="350" height="200" rx="8" class="ax-box ax-box-agent"/>
<text x="56" y="330" class="ax-tb">TLS listener</text>
<text x="56" y="349" class="ax-tm">internal/auth/auth.go · TLSConfig</text>
<text x="56" y="374" class="ax-t">RequireAndVerifyClientCert</text>
<text x="56" y="392" class="ax-t">(RequestClientCert only when /health</text>
<text x="56" y="410" class="ax-t">is opted in as anonymous)</text>
<text x="56" y="428" class="ax-t">TLS 1.2+, ECDHE + AEAD suites</text>
<text x="56" y="446" class="ax-t">X25519 / P-256 · HTTP/1.1 only</text>
<rect x="420" y="304" width="350" height="200" rx="8" class="ax-box ax-box-agent"/>
<text x="436" y="330" class="ax-tb">Identity middleware</text>
<text x="436" y="349" class="ax-tm">internal/api/middleware.go · withIdentity</text>
<text x="436" y="374" class="ax-t">auth.Verify on every request:</text>
<text x="436" y="392" class="ax-t">chain to CA pool, EKU clientAuth</text>
<text x="436" y="410" class="ax-t">identity = leaf Common Name</text>
<text x="436" y="428" class="ax-t">failure: audit rejected, then 401</text>
<text x="436" y="446" class="ax-t">no cert + anonymous /health: pass</text>
<rect x="800" y="304" width="350" height="200" rx="8" class="ax-box ax-box-agent"/>
<text x="816" y="330" class="ax-tb">Handlers</text>
<text x="816" y="349" class="ax-tm">internal/api/handlers.go · server.go</text>
<text x="816" y="374" class="ax-t">name regex, then IsAllowed (default-deny)</text>
<text x="816" y="392" class="ax-t">body ≤ 64 KiB, strict JSON, ≤ 64 params</text>
<text x="816" y="410" class="ax-t">owner-only job status and logs</text>
<text x="816" y="428" class="ax-t">POST /v1/actions/{action}</text>
<text x="816" y="446" class="ax-t">GET /v1/jobs/{id}[/logs] · GET /health</text>
<rect x="1180" y="304" width="360" height="200" rx="8" class="ax-box ax-box-agent"/>
<text x="1196" y="330" class="ax-tb">Job manager</text>
<text x="1196" y="349" class="ax-tm">internal/jobs/manager.go · Trigger, run</text>
<text x="1196" y="374" class="ax-t">validate params, exclusive TryLock</text>
<text x="1196" y="392" class="ax-t">slot cap → 429, shutdown → 503</text>
<text x="1196" y="410" class="ax-t">accepted audit, then async run()</text>
<text x="1196" y="428" class="ax-t">started audit before executor.Run</text>
<text x="1196" y="446" class="ax-t">in-memory store, bounded history</text>
<path d="M390,404 H420" class="ax-l-ctl" marker-end="url(#intl-m-ctl)"/>
<path d="M770,404 H800" class="ax-l-ctl" marker-end="url(#intl-m-ctl)"/>
<path d="M1150,404 H1180" class="ax-l-ctl" marker-end="url(#intl-m-ctl)"/>
<rect x="40" y="586" width="470" height="168" rx="8" class="ax-box"/>
<text x="56" y="612" class="ax-tb">Configuration</text>
<text x="56" y="631" class="ax-tm">internal/config/config.go · Load, validate</text>
<text x="56" y="656" class="ax-t">strict YAML, fail-closed at startup</text>
<text x="56" y="674" class="ax-t">identities → allowlists, actions, limits</text>
<text x="56" y="692" class="ax-t">parameter patterns compiled as ^(?:…)$</text>
<text x="56" y="710" class="ax-t">script, cert, key, ancestor integrity</text>
<text x="56" y="728" class="ax-t">read once: no hot reload</text>
<rect x="560" y="586" width="480" height="168" rx="8" class="ax-box ax-box-aud"/>
<text x="576" y="612" class="ax-tb">Audit subsystem</text>
<text x="576" y="631" class="ax-tm">internal/audit/audit.go · Logger.Write</text>
<text x="576" y="656" class="ax-t">stamp, truncate to 512 B, redact secret names</text>
<text x="576" y="674" class="ax-t">append JSONL line, fsync, then each Sink</text>
<text x="576" y="692" class="ax-t">error returned: callers fail closed</text>
<text x="576" y="710" class="ax-t">Sink: syslog on unix, none on Windows</text>
<rect x="1080" y="586" width="460" height="168" rx="8" class="ax-box ax-box-loc"/>
<text x="1096" y="612" class="ax-tb">Executor</text>
<text x="1096" y="631" class="ax-tm">internal/executor/executor.go · Run</text>
<text x="1096" y="656" class="ax-t">Spec: script path, env, timeout, output cap</text>
<text x="1096" y="674" class="ax-t">no argv or executable field in Spec</text>
<text x="1096" y="692" class="ax-t">timeout: terminate, 5 s grace, kill</text>
<text x="1096" y="710" class="ax-t">capped stdout / stderr buffers</text>
<path d="M215,586 V504" class="ax-l-data" marker-end="url(#intl-m-data)"/>
<text x="228" y="552" class="ax-ts">cert, key, CA paths</text>
<path d="M595,504 V586" class="ax-l-aud" marker-end="url(#intl-m-aud)"/>
<path d="M930,504 V586" class="ax-l-aud" marker-end="url(#intl-m-aud)"/>
<path d="M1220,504 V552 H1000 V586" class="ax-l-aud" marker-end="url(#intl-m-aud)"/>
<text x="1010" y="543" class="ax-ts">accepted, started, finished</text>
<path d="M1380,504 V586" class="ax-l-loc" marker-end="url(#intl-m-loc)"/>
<text x="1392" y="552" class="ax-ts">Run(ctx, Spec)</text>
<rect x="20" y="790" width="1540" height="262" rx="10" class="ax-zone"/>
<text x="40" y="816" class="ax-th">PLATFORM LAYER · files selected by build tags (_unix.go / _windows.go)</text>
<path d="M275,754 V790" class="ax-l-data" marker-end="url(#intl-m-data)"/>
<path d="M800,754 V790" class="ax-l-data" marker-end="url(#intl-m-data)"/>
<path d="M1310,754 V790" class="ax-l-data" marker-end="url(#intl-m-data)"/>
<rect x="40" y="830" width="740" height="200" rx="8" class="ax-box"/>
<text x="56" y="854" class="ax-tb">UNIX (Linux target)</text>
<text x="56" y="880" class="ax-tmb">launch_unix.go</text>
<text x="330" y="880" class="ax-t">direct exec of the script, no shell</text>
<text x="56" y="905" class="ax-tmb">process_unix.go</text>
<text x="330" y="905" class="ax-t">process group, Pdeathsig, SIGTERM then SIGKILL</text>
<text x="56" y="930" class="ax-tmb">jobs/env_unix.go</text>
<text x="330" y="930" class="ax-t">fixed PATH, nothing inherited</text>
<text x="56" y="955" class="ax-tmb">config/script_security_unix.go</text>
<text x="330" y="955" class="ax-t">root owner, no group/world write, no symlink</text>
<text x="56" y="980" class="ax-tmb">audit/syslog_unix.go</text>
<text x="330" y="980" class="ax-t">journald / syslog sink, facility AUTH</text>
<text x="56" y="1005" class="ax-tmb">cmd/axiom/main_unix.go</text>
<text x="330" y="1005" class="ax-t">signal-driven context</text>
<rect x="800" y="830" width="740" height="200" rx="8" class="ax-box"/>
<text x="816" y="854" class="ax-tb">WINDOWS</text>
<text x="816" y="880" class="ax-tmb">launch_windows.go</text>
<text x="1090" y="880" class="ax-t">fixed powershell.exe -File, GPO policy check</text>
<text x="816" y="905" class="ax-tmb">process_windows.go</text>
<text x="1090" y="905" class="ax-t">Job Object, KILL_ON_JOB_CLOSE</text>
<text x="816" y="930" class="ax-tmb">jobs/env_windows.go</text>
<text x="1090" y="930" class="ax-t">allowlisted system variables only</text>
<text x="816" y="955" class="ax-tmb">winsec_windows.go</text>
<text x="1090" y="955" class="ax-t">owner, DACL and reparse-point checks</text>
<text x="816" y="980" class="ax-tmb">audit/syslog_other.go</text>
<text x="1090" y="980" class="ax-t">no sink: audit.syslog is a config error</text>
<text x="816" y="1005" class="ax-tmb">service_windows.go</text>
<text x="1090" y="1005" class="ax-t">SCM service, recovery, event log</text>
</svg>
